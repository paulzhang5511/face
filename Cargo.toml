[workspace]
resolver = "2"
members = ["face-core", "face-cli", "face-demo", "face-android"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "跨平台人脸分析引擎 — 基于ONNX Runtime的人脸检测/关键点/网格/语义分割"

[workspace.dependencies]
face-core = { path = "face-core", version = "0.2.0" }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["half", "ndarray", "download-binaries", "tls-rustls"] }
image = "0.25"
ndarray = "0.17"
num_cpus = "1"
rayon = "1.12.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
