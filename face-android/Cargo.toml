[package]
name = "face-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Android 设备侧基准/验证工具 — face-core on-device bench & correctness check"

[dependencies]
face-core = { workspace = true }
ndarray = { workspace = true }
image = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
ort = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[[bin]]
name = "face-bench-android"
path = "src/bin/face-bench-android.rs"

[[bin]]
name = "batch-check-android"
path = "src/bin/batch-check-android.rs"
